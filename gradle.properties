# ==========================================================================
# 课表 · Gradle 构建配置
# ==========================================================================
# 需要 JDK 17（AGP 8.6.1 要求）。用 Android Studio 自带 JDK 或手动设置 JAVA_HOME。

org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# --------------------------------------------------------------------------
# Android
# --------------------------------------------------------------------------
android.useAndroidX=true
android.nonFinalResIds=false
android.defaults.buildfeatures.buildconfig=false

# 项目目录名可能是中文（本项目就叫「课表」）。AGP 默认会因非 ASCII 路径
# 直接中止构建，这里显式关闭该检查；在纯 ASCII 路径下也没有任何副作用。
android.overridePathCheck=true

# --------------------------------------------------------------------------
# Kotlin
# --------------------------------------------------------------------------
kotlin.code.style=official
